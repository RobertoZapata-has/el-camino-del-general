<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14213A">
<title>El camino del General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root {
  --tinta: #1F2E4D;
  --noche: #14213A;
  --papel: #F4E8CE;
  --papel2: #E9D6AC;
  --salvia: #8FA683;
  --sol: #F0B52C;
  --celeste: #8DB7C9;
  --terracota: #B5483C;
  --display: 'Alfa Slab One', Rockwell, 'Rockwell Extra Bold', Georgia, serif;
  --texto: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--noche); color: var(--tinta); font: 400 16px/1.45 var(--texto); overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }
[hidden] { display: none !important; }

.pantalla { position: fixed; inset: 0; overflow: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* ---------- inicio ---------- */
#inicio { display: grid; grid-template-rows: minmax(210px, 42vh) 1fr; background: var(--noche); }
.hero { position: relative; background: var(--noche) center / cover no-repeat; display: flex; align-items: flex-start; justify-content: center; text-align: center; padding: 18px 16px; }
.hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(to bottom, transparent, var(--noche)); }
.hero-titulo { position: relative; z-index: 1; max-width: 30rem; }
.sobre { margin: 0 0 6px; font: 600 12px/1.2 var(--texto); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta); }
h1 { margin: 0; font: 400 clamp(30px, 8vw, 52px)/1.04 var(--display); color: var(--tinta); text-wrap: balance; text-shadow: 0 1px 0 rgba(255, 244, 214, .7); }
.panel { width: min(30rem, 100%); margin: 0 auto; padding: 8px 16px 28px; display: grid; gap: 12px; align-content: start; color: var(--papel); }
.panel label { font-weight: 600; font-size: 14px; color: var(--papel2); }
input[type=text] { width: 100%; min-height: 50px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--papel2); background: var(--papel); color: var(--tinta); font: 600 18px var(--texto); }
.fila { display: flex; gap: 10px; }
.fila > input { flex: 1 1 auto; min-width: 0; text-transform: uppercase; letter-spacing: .12em; text-align: center; }
.boton { min-height: 52px; padding: 0 18px; border-radius: 10px; font-weight: 700; font-size: 17px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.boton:disabled { opacity: .45; cursor: default; }
.primario { background: var(--sol); color: var(--tinta); box-shadow: 0 3px 0 #B98712; }
.primario:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #B98712; }
.secundario { border: 2px solid var(--papel2); color: var(--papel); }
.suave { color: var(--papel2); text-decoration: underline; min-height: 40px; }
.msg { min-height: 22px; margin: 0; font-weight: 600; color: #FFB4A6; }
.msg.ok { color: #BFE0B0; }
.nota { margin: 0; font-size: 14px; color: var(--papel2); opacity: .9; }
.local-n { display: flex; gap: 8px; align-items: center; color: var(--papel2); }
.local-n .boton { flex: 1; min-height: 46px; }
@media (orientation: landscape) and (min-width: 700px) {
  #inicio { grid-template-rows: none; grid-template-columns: 1.15fr 1fr; }
  .hero { min-height: 100%; }
  .hero::after { inset: 0 0 0 auto; width: 30%; height: auto; background: linear-gradient(to right, transparent, var(--noche)); }
  .panel { align-content: center; }
}

/* ---------- sala ---------- */
#sala { background: var(--noche); color: var(--papel); }
.sala-in { width: min(34rem, 100%); margin: 0 auto; padding: 22px 16px 32px; display: grid; gap: 16px; }
.sala-in h2 { margin: 0; font: 400 26px/1.1 var(--display); }
.codigo { display: inline-block; padding: 4px 12px; border-radius: 8px; background: var(--papel); color: var(--tinta); font: 400 28px/1.2 var(--display); letter-spacing: .12em; }
.slots { display: grid; gap: 8px; }
.slot { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px; border-radius: 10px; background: rgba(244, 232, 206, .09); border: 2px dashed rgba(244, 232, 206, .28); }
.slot.lleno { background: var(--papel); color: var(--tinta); border: 2px solid var(--papel2); }
.slot img { width: 40px; height: 48px; object-fit: contain; object-position: bottom; }
.slot .vacio { width: 40px; height: 48px; border-radius: 50%; background: rgba(244, 232, 206, .08); }
.slot b { display: block; font-size: 18px; }
.slot small { color: #6A6F7C; font-weight: 600; }
.slot:not(.lleno) span { opacity: .6; }
.etiqueta { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 99px; background: var(--sol); color: var(--tinta); font-size: 12px; font-weight: 700; }
.acciones { display: grid; gap: 10px; }

/* ---------- salida ---------- */
#salida { display: grid; place-items: center; text-align: center; background: var(--noche); color: var(--papel); padding: 24px; }
#salida h2 { margin: 0 0 8px; font: 400 32px/1.1 var(--display); }
#salida p { margin: 0 auto 16px; max-width: 26rem; }

/* ---------- juego: una sola pantalla ---------- */
#juego { background: #0B1426; overflow: hidden; padding: 0; }
#escenario { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #26364F; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#camino { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#casilleros { position: absolute; inset: 0; pointer-events: none; }
#fichas { position: absolute; inset: 0; pointer-events: none; z-index: 2; }

.cas { position: absolute; width: 82px; height: 78px; margin: -39px 0 0 -41px; border-radius: 12px; display: grid; place-items: center; }
.cas .tinte { position: absolute; inset: 3px; border-radius: 9px; opacity: .55; }
.cas .num { position: absolute; left: 5px; top: 1px; font: 400 25px/1 var(--display); color: var(--tinta); text-shadow: 0 1px 0 rgba(255, 248, 228, .9), 1px 0 0 rgba(255, 248, 228, .9), -1px 0 0 rgba(255, 248, 228, .9); }
.cas .ico { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; }
.cas.especial .ico { top: 46%; }
.cas .rot { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font: 700 11px/1 var(--texto); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta); opacity: .75; }
.cas.pulsa::after { content: ""; position: absolute; inset: -4px; border-radius: 14px; border: 5px solid var(--sol); animation: pulsa .8s ease-out 2; }
.cas.turno-cas::after { content: ""; position: absolute; inset: -3px; border-radius: 14px; border: 4px solid var(--sol); box-shadow: 0 0 0 2px var(--tinta); }
@keyframes pulsa { from { transform: scale(1); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }

.ficha { position: absolute; pointer-events: none; transition: left .32s ease-in-out, top .32s ease-in-out; filter: drop-shadow(0 3px 2px rgba(20, 33, 58, .5)); }
.ficha.salto { transition: left .8s cubic-bezier(.3, .1, .3, 1), top .8s cubic-bezier(.3, .1, .3, 1); animation: brinco .8s; }
.ficha.quieta { transition: none; }
.ficha.turno::after { content: ""; position: absolute; left: 50%; top: -14px; width: 0; height: 0; margin-left: -8px; border: 8px solid transparent; border-top: 12px solid var(--sol); filter: drop-shadow(0 1px 0 var(--tinta)); animation: flota 1s infinite ease-in-out; }
@keyframes brinco { 50% { transform: translateY(-40px) scale(1.12); } }
@keyframes flota { 50% { transform: translateY(-5px); } }
.ficha.pozo { filter: drop-shadow(0 3px 2px rgba(20, 33, 58, .5)) saturate(.6); }

.chip { background: rgba(244, 232, 206, .96); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 12px; box-shadow: 0 3px 0 rgba(20, 33, 58, .4); }

/* panel izquierdo: jugadores */
#izq { position: absolute; left: 14px; top: 50px; width: 186px; bottom: 44px; display: flex; flex-direction: column; justify-content: space-between; z-index: 5; }
#jugadores { display: grid; gap: 6px; padding: 8px; background: rgba(244, 232, 206, .96); border: 3px solid var(--tinta); border-radius: 12px; box-shadow: 0 3px 0 rgba(20, 33, 58, .4); }
.jug { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: center; min-height: 54px; padding: 3px 6px; border-radius: 9px; border-left: 7px solid var(--c, #999); background: rgba(31, 46, 77, .07); position: relative; }
.jug img { width: 34px; height: 44px; object-fit: contain; object-position: bottom; }
.jug b { display: block; font: 700 21px/1.1 var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 112px; }
.jug small { font: 600 17px/1.1 var(--texto); color: #4F5E7C; }
.jug.activo { background: var(--sol); }
.jug.activo small { color: var(--tinta); }
.jug .estado { position: absolute; right: 4px; top: 3px; font: 700 11px/1 var(--texto); padding: 3px 6px; border-radius: 99px; background: var(--tinta); color: var(--papel); }
.jug.fuera { opacity: .55; }
#botones { display: flex; gap: 8px; }
.mini { min-height: 48px; padding: 0 16px; border-radius: 10px; background: rgba(244, 232, 206, .96); border: 3px solid var(--tinta); font: 700 22px/1 var(--texto); color: var(--tinta); }

/* panel derecho: turno, dados, jugada */
#der { position: absolute; right: 20px; top: 50px; width: 168px; bottom: 44px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
#hud-turno { padding: 8px 10px; text-align: center; }
#hud-turno b { display: block; font: 400 27px/1.1 var(--display); word-break: break-word; }
#hud-turno span { font: 600 19px/1.2 var(--texto); color: #4A5877; }
#hud-turno.mio { background: var(--sol); }
#hud-turno.mio span { color: var(--tinta); }
.dados { display: flex; gap: 12px; justify-content: center; }
.dado { width: 64px; height: 64px; padding: 8px; border-radius: 12px; background: #FFFBF0; border: 3px solid var(--tinta); box-shadow: 0 3px 0 rgba(0, 0, 0, .4); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
.dado i { border-radius: 50%; }
.dado i.on { background: var(--tinta); }
.dado.tira { animation: sacude .25s infinite; }
@keyframes sacude { 25% { transform: rotate(-12deg) translateY(-6px); } 75% { transform: rotate(12deg) translateY(-3px); } }
#tirar { min-height: 64px; border-radius: 12px; background: var(--sol); color: var(--tinta); font: 400 24px/1.05 var(--display); box-shadow: 0 4px 0 #B98712; padding: 4px 8px; }
#tirar:disabled { background: #5A6A86; color: #D5DCEA; box-shadow: none; font-size: 18px; }
#tirar:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #B98712; }
#jugada { flex: 1; min-height: 0; padding: 10px 10px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; overflow: hidden; }
#jugada-icono { width: 56px; height: 56px; flex: none; }
#jugada-icono svg { width: 100%; height: 100%; }
#jugada-titulo { font: 400 24px/1.1 var(--display); }
#jugada-texto { font: 600 20px/1.25 var(--texto); color: #34415E; }

#conexion { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 40; padding: 6px 16px; border-radius: 99px; background: var(--terracota); color: #FFF3E6; font: 700 20px/1.2 var(--texto); }

#fin { position: absolute; inset: 0; z-index: 30; background: rgba(20, 33, 58, .82); display: grid; place-items: center; }
#fin .caja { width: 620px; padding: 22px 28px; border-radius: 16px; border: 4px solid var(--tinta); background: var(--papel); text-align: center; box-shadow: 0 8px 0 rgba(0, 0, 0, .35); }
#fin h2 { margin: 0 0 4px; font: 400 38px/1.1 var(--display); text-wrap: balance; }
#fin .gana img { height: 130px; margin: 6px 0; }
#fin ol { margin: 8px auto 14px; padding: 0; list-style: none; display: grid; gap: 4px; max-width: 420px; font: 600 24px/1.2 var(--texto); text-align: left; }
#fin ol li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 10px; border-radius: 8px; background: rgba(31, 46, 77, .08); }
#fin .botones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
#fin .boton { min-height: 58px; font-size: 24px; }
#fin .secundario { border-color: var(--tinta); color: var(--tinta); }

#rota { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; text-align: center; background: var(--noche); color: var(--papel); padding: 24px; }
#rota b { display: block; margin-bottom: 8px; font: 400 28px/1.1 var(--display); }
#rota .giro { display: inline-block; width: 64px; height: 100px; border: 5px solid var(--papel); border-radius: 12px; margin-bottom: 18px; animation: gira 2.4s infinite ease-in-out; }
@keyframes gira { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
body.jugando #rota { display: grid; }
@media (orientation: landscape) { body.jugando #rota { display: none; } }
@media (prefers-reduced-motion: reduce) { .ficha, .dado.tira, .ficha.turno::after, .cas.pulsa::after { animation: none !important; } }

/* cartel central: dados y sucesos */
#evento { position: absolute; left: 50%; top: 50%; width: 600px; transform: translate(-50%, -50%); z-index: 20; padding: 22px 26px 24px; text-align: center; background: var(--papel); color: var(--tinta); border: 5px solid var(--tinta); border-radius: 20px; box-shadow: 0 10px 0 rgba(20, 33, 58, .45), 0 0 0 9999px rgba(20, 33, 58, .38); transition: opacity .25s, transform .25s; cursor: pointer; }
#evento.fuera { opacity: 0; transform: translate(-50%, -46%) scale(.94); pointer-events: none; box-shadow: none; }
#evento .ev-quien { display: block; font: 400 34px/1.1 var(--display); margin-bottom: 12px; }
#evento .dados { gap: 22px; margin: 4px 0 10px; }
#evento .dado { width: 110px; height: 110px; padding: 14px; border-radius: 18px; }
#evento .ev-suma { font: 400 54px/1 var(--display); min-height: 54px; }
#evento .ev-ico { width: 150px; height: 150px; margin: 0 auto 6px; }
#evento .ev-ico svg { width: 100%; height: 100%; }
#evento h3 { margin: 0 0 8px; font: 400 44px/1.08 var(--display); text-wrap: balance; }
#evento p { margin: 0; font: 600 29px/1.25 var(--texto); color: #34415E; text-wrap: balance; }
#evento .ev-pie { margin-top: 12px; font: 600 18px/1 var(--texto); color: #6B7690; }
</style>
</head>
<body>

<section id="inicio" class="pantalla">
  <div class="hero" id="hero">
    <div class="hero-titulo">
      <p class="sobre">Juego de la Oca</p>
      <h1>El camino del General</h1>
    </div>
  </div>
  <div class="panel">
    <div id="bloque-nombre">
      <label for="nombre">Tu nombre</label>
      <input id="nombre" type="text" maxlength="16" autocomplete="off" placeholder="Ej: Rober">
    </div>
    <div id="bloque-crear">
      <button id="btn-crear" class="boton primario" style="width:100%">Crear sala</button>
    </div>
    <div id="bloque-unirse">
      <label for="codigo">¿Te pasaron un código?</label>
      <div class="fila">
        <input id="codigo" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="CÓDIGO">
        <button id="btn-unirse" class="boton secundario">Unirme</button>
      </div>
    </div>
    <p class="msg" id="msg-inicio" role="status"></p>
    <div id="bloque-reanudar" hidden>
      <button id="btn-reanudar" class="boton secundario" style="width:100%">Retomar partida anterior</button>
    </div>
    <div id="bloque-local">
      <div class="local-n"><span>Jugar en este celular:</span></div>
      <div class="local-n" id="local-n" style="margin-top:6px">
        <button class="boton secundario" data-n="2">2</button>
        <button class="boton secundario" data-n="3">3</button>
        <button class="boton secundario" data-n="4">4</button>
        <button class="boton secundario" data-n="5">5</button>
      </div>
    </div>
    <p class="nota">El clásico juego de la oca, de 2 a 5 jugadores. Gana quien llega primero a la casilla 63.</p>
  </div>
</section>

<section id="sala" class="pantalla" hidden>
  <div class="sala-in">
    <h2>Sala <span class="codigo" id="sala-codigo">-----</span></h2>
    <div class="acciones" id="sala-invitar">
      <button id="btn-wsp" class="boton primario">Invitar por WhatsApp</button>
      <button id="btn-copiar" class="boton secundario">Copiar link</button>
    </div>
    <div class="slots" id="slots"></div>
    <p class="nota" id="sala-nota"></p>
    <div class="acciones">
      <button id="btn-empezar" class="boton primario">Empezar</button>
      <button id="btn-salir-sala" class="suave">Salir</button>
    </div>
  </div>
</section>

<section id="salida" class="pantalla" hidden>
  <div>
    <h2>¡Hasta la próxima!</h2>
    <p>Próximamente en Play Store.</p>
  </div>
</section>

<section id="juego" class="pantalla" hidden>
  <div id="escenario">
    <img id="fondo" alt="" draggable="false">
    <svg id="camino" viewBox="0 0 1280 720"></svg>
    <div id="casilleros"></div>
    <div id="fichas"></div>

    <div id="izq">
      <div id="jugadores"></div>
      <div id="botones">
        <button class="mini" id="btn-pantalla" aria-label="Pantalla completa">⛶</button>
        <button class="mini" id="btn-menu">Salir</button>
      </div>
    </div>

    <div id="der">
      <div class="chip" id="hud-turno"><b id="turno-nombre"></b><span id="turno-sub"></span></div>
      <div class="dados"><div class="dado" id="d0"></div><div class="dado" id="d1"></div></div>
      <button id="tirar">Tirar dados</button>
      <div class="chip" id="jugada"><div id="jugada-icono"></div><b id="jugada-titulo"></b><span id="jugada-texto"></span></div>
    </div>

    <div id="evento" class="fuera"></div>
    <div id="conexion" hidden>Reconectando…</div>
    <div id="fin" hidden><div class="caja" id="fin-caja"></div></div>
  </div>
</section>

<script>/* Reglas de El camino del General: Juego de la Oca clásico de 63 casillas.
   Lógica pura, sin pantalla ni red. Sirve en el navegador (global Reglas) y en Node (pruebas). */

  function tipoDe(n) {

    if (n === 1) return 'inicio';

    if (n === POSADA) return 'posada';
    if (n === POZO) return 'pozo';
    if (DADOS.indexOf(n) >= 0) return 'dados';

  }

  function dados(rng) {
    return [1 + Math.floor(rng() * 6), 1 + Math.floor(rng() * 6)];
  }

  function nuevaSala(codigo) {
    return { v: 2, codigo: codigo, fase: 'sala', seq: 0, partida: 0, jugada: 0, turno: 0, ganador: null, ultima: null, jugadores: [] };
  }

  function jugadorPorId(sala, id) {

    if (ya) {

    pintarDados(sala.ultima && sala.ultima.dados);
    if (!vieneDeAnimacion) pintarJugada(describir(sala, sala.ultima));
    else if (sala.ultima && sala.ultima.extra) { /* se mantiene el cartel del efecto */ }
    pintarJugadores(sala);
    pintarTurno(sala);
    pintarFin(sala);
    controles();
    if (vieneDeAnimacion && sala.ultima && sala.ultima.salteados && sala.ultima.salteados.length) {
      var nombres = sala.ultima.salteados.map(function (id) { return nombreJug(sala, id); }).join(', ');
      pintarJugada({ tipo: 'posada', titulo: 'Turno salteado', texto: nombres + ' no juega esta vuelta.' });
    }
  }

  function esMiTurno(sala) {
    if (!sala || sala.fase !== 'jugando') return false;
    var a = sala.jugadores[sala.turno];
    if (!a) return false;
    return app.modo === 'local' || a.id === pid;
  }

  function pintarTurno(sala) {
    var t = $('hud-turno'), a = sala.jugadores[sala.turno];
    if (sala.fase !== 'jugando' || !a) { t.hidden = true; return; }
    t.hidden = false;
    var mio = esMiTurno(sala);
    t.classList.toggle('mio', mio);
    $('turno-nombre').textContent = app.modo === 'local' ? a.nombre : (mio ? '¡Te toca!' : a.nombre);
    $('turno-sub').textContent = mio ? (app.modo === 'local' ? 'Tira dados' : 'Tirá los dados') : (a.conectado ? 'está jugando' : 'sin señal');
  }

  function pintarJugadores(sala) {
    var cont = $('jugadores'); cont.innerHTML = '';
    var activo = sala.jugadores[sala.turno];
    sala.jugadores.forEach(function (j) {
      var fila = h('div', { cls: 'jug' + (sala.fase === 'jugando' && activo && activo.id === j.id ? ' activo' : '') + (j.conectado ? '' : ' fuera'), style: '--c:' + COLORES[j.slot] },
        h('img', { src: IMG['ficha_' + j.slot], alt: '' }),
        h('div', null, h('b', { text: j.nombre }), h('small', { text: 'Casilla ' + j.pos + (app.modo === 'red' && j.id === pid ? ' · vos' : '') })));
      var est = !j.conectado ? 'Sin señal' : j.pozo ? 'Pozo' : j.pausa > 0 ? ('Pierde ' + j.pausa) : '';
      if (est) fila.appendChild(h('span', { cls: 'estado', text: est }));
      cont.appendChild(fila);
    });
  }

  function pintarFin(sala) {
    var f = $('fin');
    if (sala.fase !== 'fin') { f.hidden = true; return; }
    var g = R.jugadorPorId(sala, sala.ganador);
    var caja = $('fin-caja'); caja.innerHTML = '';
    caja.appendChild(h('h2', { text: '¡' + g.nombre + ' ganó!' }));
    caja.appendChild(h('div', { cls: 'gana' }, h('img', { src: IMG['ficha_' + g.slot], alt: '' })));
    var ol = h('ol');
    sala.jugadores.slice().sort(function (a, b) { return b.pos - a.pos; }).forEach(function (j) {
      ol.appendChild(h('li', null, h('span', { text: j.nombre }), h('span', { text: 'casilla ' + j.pos })));
    });
    caja.appendChild(ol);
    var bs = h('div', { cls: 'botones' });
    if (app.anfitrion) { var o = h('button', { cls: 'boton primario', text: 'Otra partida' }); o.onclick = function () { enviar({ t: 'otra' }); }; bs.appendChild(o); }
    else bs.appendChild(h('span', { text: 'Esperando que el anfitrión arme otra…', style: 'font-weight:600;align-self:center' }));
    var s = h('button', { cls: 'boton secundario', text: 'Salir' }); s.onclick = salirDelJuego; bs.appendChild(s);
    caja.appendChild(bs);
    f.hidden = false;
  }

  /* ---------- controles ---------- */
  function controles() {
    var s = app.visible, b = $('tirar');
    if (!s || s.fase !== 'jugando') { b.disabled = true; return; }
    var a = s.jugadores[s.turno], libre = ocupado === 0 && !app.pendiente;
    var mio = esMiTurno(s);
    b.disabled = !(mio && libre);
    b.textContent = mio ? 'Tirar dados' : 'Juega ' + (a ? a.nombre : '');
  }
  $('tirar').onclick = function () {
    if ($('tirar').disabled) return;
    app.pendiente = true; controles();
    setTimeout(function () { if (app.pendiente) { app.pendiente = false; controles(); } }, 4000);
    enviar({ t: 'tirar' });
  };
  var salirT = null;
  $('btn-menu').onclick = function () {
    var b = this;
    if (b.getAttribute('data-seguro')) { clearTimeout(salirT); b.removeAttribute('data-seguro'); b.textContent = 'Salir'; salirDelJuego(); return; }
    b.setAttribute('data-seguro', '1'); b.textContent = '¿Seguro?';
    salirT = setTimeout(function () { b.removeAttribute('data-seguro'); b.textContent = 'Salir'; }, 3000);
  };
  $('btn-pantalla').onclick = function () {
    var de = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (de.requestFullscreen) de.requestFullscreen().then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () { }); }).catch(function () { });
    } catch (e) { }
  };

  window.__ecdg = { estado: function () { return app.visible; }, app: app, ocupado: function () { return ocupado; }, pid: pid };

  prepararInicio();
})();
</script>
</body>
</html>
